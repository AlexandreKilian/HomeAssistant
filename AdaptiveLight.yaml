blueprint:
  name: Motion-activated Light with Time Brightness
  description: Turn light(s) on when a motion/occupancy sensor becomes active, set brightness by time, turn off when inactive.
  domain: automation

  input:
    presence_sensor:
      name: Motion / Occupancy Sensor
      description: A binary_sensor that goes active/inactive.
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: motion
            - domain: binary_sensor
              device_class: occupancy
            - domain: binary_sensor
              device_class: presence

    target_light:
      name: Lights
      description: The lights to keep in sync.
      selector:
        target:
          entity:
            - domain: light

    active_state:
      name: Active state
      description: Usually "on" for binary_sensors. Some integrations use "occupied".
      default: "on"
      selector:
        text: {}

    inactive_state:
      name: Inactive state
      description: Usually "off" for binary_sensors. Some integrations use "clear".
      default: "off"
      selector:
        text: {}

    night_start:
      name: Night starts at
      default: "23:00:00"
      selector:
        time: {}

    morning_start:
      name: Morning starts at
      default: "06:00:00"
      selector:
        time: {}

    day_start:
      name: Day starts at
      default: "09:00:00"
      selector:
        time: {}

    evening_start:
      name: Evening starts at
      default: "17:00:00"
      selector:
        time: {}

    night_brightness:
      name: Night brightness (%)
      default: 8
      selector:
        number:
          min: 1
          max: 100
          step: 1

    morning_brightness:
      name: Morning brightness (%)
      default: 30
      selector:
        number:
          min: 1
          max: 100
          step: 1

    day_brightness:
      name: Day brightness (%)
      default: 100
      selector:
        number:
          min: 1
          max: 100
          step: 1

    evening_brightness:
      name: Evening brightness (%)
      default: 80
      selector:
        number:
          min: 1
          max: 100
          step: 1

    no_motion_wait:
      name: Wait time
      description: Time to leave the light on after last motion is detected.
      default: 120
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds

triggers:
  - trigger: state
    entity_id: !input presence_sensor
    to: !input active_state
  - trigger: state
    entity_id: !input presence_sensor
    to: !input inactive_state
    for: !input no_motion_wait

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.state == active_state }}"
        sequence:
          - action: light.turn_on
            target: !input target_light
            data:
              brightness_pct: >
                {% set current_time = now().time() %}
                {% set night_start = today_at(night_start).time() %}
                {% set morning_start = today_at(morning_start).time() %}
                {% set day_start = today_at(day_start).time() %}
                {% set evening_start = today_at(evening_start).time() %}
                {% if current_time >= night_start or current_time < morning_start %}
                  {{ night_brightness }}
                {% elif current_time >= morning_start and current_time < day_start %}
                  {{ morning_brightness }}
                {% elif current_time >= day_start and current_time < evening_start %}
                  {{ day_brightness }}
                {% else %}
                  {{ evening_brightness }}
                {% endif %}
      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.state == inactive_state }}"
        sequence:
          - action: light.turn_off
            target: !input target_light
variables:
  active_state: !input active_state
  inactive_state: !input inactive_state
  night_start: !input night_start
  morning_start: !input morning_start
  day_start: !input day_start
  evening_start: !input evening_start
  night_brightness: !input night_brightness
  morning_brightness: !input morning_brightness
  day_brightness: !input day_brightness
  evening_brightness: !input evening_brightness
          unit_of_measurement: "%"

    morning_brightness:
      name: Morning brightness (%)
      default: 35
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"

    day_brightness:
      name: Day brightness (%)
      default: 80
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"

    evening_brightness:
      name: Evening brightness (%)
      default: 60
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"

    transition_seconds:
      name: Transition seconds
      default: 0.5
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          unit_of_measurement: s

triggers:
  - trigger: state
    entity_id: !input presence_sensor

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state is not none and trigger.to_state.state == (active_state | string) }}"
        sequence:
          - variables:
              night_start_t: !input night_start
              morning_start_t: !input morning_start
              day_start_t: !input day_start
              evening_start_t: !input evening_start

              night_b: !input night_brightness
              morning_b: !input morning_brightness
              day_b: !input day_brightness
              evening_b: !input evening_brightness

              brightness_pct: >-
                {% set now_m = now().hour * 60 + now().minute %}
                {% set ns = strptime(night_start_t, '%H:%M:%S') %}
                {% set ms = strptime(morning_start_t, '%H:%M:%S') %}
                {% set ds = strptime(day_start_t, '%H:%M:%S') %}
                {% set es = strptime(evening_start_t, '%H:%M:%S') %}
                {% set ns_m = ns.hour * 60 + ns.minute %}
                {% set ms_m = ms.hour * 60 + ms.minute %}
                {% set ds_m = ds.hour * 60 + ds.minute %}
                {% set es_m = es.hour * 60 + es.minute %}

                {% if now_m >= ns_m or now_m < ms_m %}
                  {{ night_b }}
                {% elif now_m < ds_m %}
                  {{ morning_b }}
                {% elif now_m < es_m %}
                  {{ day_b }}
                {% else %}
                  {{ evening_b }}
                {% endif %}

          - action: light.turn_on
            target: !input target_light
            data:
              brightness_pct: "{{ brightness_pct | int }}"
              transition: !input transition_seconds

      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state is not none and trigger.to_state.state == (inactive_state | string) }}"
        sequence:
          - action: light.turn_off
            target: !input target_light
            data:
              transition: !input transition_seconds
