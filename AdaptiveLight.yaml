blueprint:
  name: Presence Light with Time Brightness (motion or occupancy)
  description: Turn light(s) on when a motion/occupancy sensor becomes active, set brightness by time, turn off when inactive.
  domain: automation

  input:
    presence_sensor:
      name: Motion / Occupancy Sensor
      description: A binary_sensor that goes active/inactive.
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: motion
            - domain: binary_sensor
              device_class: occupancy
            - domain: binary_sensor
              device_class: presence

    target_light:
      name: Lights
      description: The lights to keep in sync.
      selector:
        target:
          entity:
            - domain: light

    active_state:
      name: Active state
      description: Usually "on" for binary_sensors. Some integrations use "occupied".
      default: "on"
      selector:
        text: {}

    inactive_state:
      name: Inactive state
      description: Usually "off" for binary_sensors. Some integrations use "clear".
      default: "off"
      selector:
        text: {}

    night_start:
      name: Night starts at
      default: "23:00:00"
      selector:
        time: {}

    morning_start:
      name: Morning starts at
      default: "06:00:00"
      selector:
        time: {}

    day_start:
      name: Day starts at
      default: "09:00:00"
      selector:
        time: {}

    evening_start:
      name: Evening starts at
      default: "17:00:00"
      selector:
        time: {}

    night_brightness:
      name: Night brightness (%)
      default: 8
      selector:
        number:
          min: 1
          max: 100
          step: 1
